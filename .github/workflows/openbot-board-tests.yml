name: OpenBot board integration
on:
  push:
    branches:
      - fix/board-vercel-integration
  pull_request:
    paths:
      - 'openbot/**'
      - 'board/**'
      - '.github/workflows/openbot-board-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run OpenBot tests including board HTTP and AG-UI POST
        working-directory: openbot
        run: npm test
        env:
          BOARD_WRITE: '0'
          STREAM_DELAY_MS: '0'
